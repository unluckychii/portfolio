<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/uploads/favicon.png" />
    <link rel="apple-touch-icon" href="/uploads/favicon.png" />
    <meta name="theme-color" content="#e7e1cf" />
    <title>Aaron's Desks</title>
    <link rel="preload" as="image" href="/loader-cat.webp" type="image/webp" />
    <style>
      /* the loading screen: shown before any script runs, lifted once the desk is in (src/desk/loadProgress.ts) */
      #loader {
        --tw: min(280px, 72vw); /* the bar's length */
        --cw: 68px; /* the cat's width (a frame of loader-cat.webp, at half size) */
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        overflow: hidden;
        background: #e7e1cf;
        color: #1d2117;
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.15s, visibility 0s linear 0.85s;
      }
      #loader .ld-name {
        margin: 0;
        font: italic 400 clamp(32px, 6vw, 52px) / 1 'Instrument Serif', Georgia, 'Times New Roman', serif;
        transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      #loader .ld-track { position: relative; width: var(--tw); padding-top: 46px; transition: opacity 0.45s ease 0.08s, transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.08s; }
      #loader .ld-bar { height: 2px; background: rgba(29, 33, 23, 0.16); overflow: hidden; border-radius: 2px; }
      /* the line fills to under the cat's middle, as if it's drawing it */
      #loader .ld-bar i {
        display: block;
        height: 100%;
        background: #1d2117;
        transform: translateX(calc(-100% + var(--loaded, 0.06) * (var(--tw) - var(--cw)) + var(--cw) / 2));
        transition: transform var(--step, 0.35s) linear;
      }
      /* the cat walks along the bar; its legs are a 12-frame strip stepped through */
      #loader .ld-cat {
        position: absolute;
        left: 0;
        bottom: 1px;
        width: var(--cw);
        height: 48px;
        overflow: hidden;
        transform: translateX(calc(var(--loaded, 0.06) * (var(--tw) - var(--cw))));
        transition: transform var(--step, 0.35s) linear;
      }
      #loader .ld-cat i {
        display: block;
        width: calc(var(--cw) * 12);
        height: 100%;
        background: url(/loader-cat.webp) 0 0 / 100% 100% no-repeat;
        animation: ld-walk 0.95s steps(12) infinite;
      }
      @keyframes ld-walk { to { transform: translateX(-100%); } }
      #loader .ld-pct { font: 500 11px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.08em; color: rgba(29, 33, 23, 0.62); font-variant-numeric: tabular-nums; transition: opacity 0.3s ease; }
      #loader .ld-pct::after { counter-reset: p var(--pct, 6); content: counter(p) '%'; }

      /* done: the cat trots off the right of the screen, then everything lifts away */
      #loader[data-done] .ld-cat { transform: translateX(calc(50vw + var(--tw) / 2 + 20px)); transition: transform 0.9s cubic-bezier(0.5, 0, 0.75, 0.4); }
      #loader[data-done] .ld-cat i { animation-duration: 0.6s; }
      #loader[data-done] .ld-bar i { transform: none; transition: transform 0.4s ease-out; }
      #loader[data-done] .ld-pct { opacity: 0; }
      #loader[data-gone] { opacity: 0; visibility: hidden; }
      #loader[data-gone] .ld-name, #loader[data-gone] .ld-track { opacity: 0; transform: translateY(-10px); }

      @media (prefers-reduced-motion: reduce) {
        #loader { transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
        #loader *, #loader[data-done] .ld-cat { transition: none !important; }
        #loader .ld-cat i { animation: none; }
        #loader[data-gone] .ld-name, #loader[data-gone] .ld-track { transform: none; }
      }
    </style>
    <script>
      // until the loading screen lifts, the desk waits underneath it, ready to settle into view
      document.documentElement.dataset.loading = ''
    </script>
  </head>
  <body>
    <div id="loader">
      <p class="ld-name">Aaron's desk</p>
      <div class="ld-track">
        <div class="ld-bar" role="progressbar" aria-label="Loading the desk" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6"><i></i></div>
        <div class="ld-cat" aria-hidden="true"><i></i></div>
      </div>
      <span class="ld-pct" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
