# Builds the site and publishes it to GitHub Pages on every push to main,
# including saves from the CMS at /admin. Needs Settings → Pages → Source:
# "GitHub Actions" (a branch source would publish the unbuilt source files).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # with a custom domain (a CNAME file) the site is served from its root;
      # otherwise from https://<user>.github.io/<repo>/
      - name: Choose the base path
        run: |
          if [ -s CNAME ]; then echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"; fi
      - name: Build
        run: npm run build
      - name: Keep the custom domain
        run: if [ -s CNAME ]; then cp CNAME dist/CNAME; fi
      # Pages has no rewrites: serve the app for direct links like /coffee
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
