# Sveltia CMS (a drop-in replacement for Decap CMS) — edits are committed to the repo,
# then the GitHub Pages workflow rebuilds the site.
# Live site: open /admin and sign in with a GitHub access token that can write to the repo.
# Locally: open /admin on `npm run dev` and pick "Work with Local Repository" (Chrome or Edge).
backend:
  name: github
  repo: unluckychii/portfolio
  branch: main # the branch the live site is built from

media_folder: public/uploads # where uploaded images are stored in the repo
public_folder: /uploads # how the site refers to them

site_url: https://unluckychi.com/
display_url: https://unluckychi.com/

collections:
  - name: desk
    label: Desk objects
    label_singular: Desk object
    description: >-
      The page that opens when a visitor clicks an object on the desk, and the name tag shown
      when they hover it. There is one entry per object (laptop, coffee cup, books, pigeon); the
      objects themselves are fixed.
    folder: content/desk
    format: json
    extension: json
    create: false
    delete: false
    identifier_field: label
    summary: '{{label}} · {{hint}}'
    sortable_fields: [order, label]
    editor:
      preview: false
    fields:
      - { label: Object, name: id, widget: hidden }
      - { label: Order in the list, name: order, widget: number, value_type: int, min: 1, hint: 'Position in the list along the bottom of the desk, and the "Next on the desk" order' }
      - { label: Name, name: label, widget: string, hint: 'Shown on hover and in the list along the bottom, e.g. The coffee cup' }
      - { label: Hint, name: hint, widget: string, required: false, hint: 'One word shown with the name, e.g. About' }
      - { label: Kicker, name: kicker, widget: string, required: false, hint: 'Small line above the page title' }
      - { label: Page title, name: title, widget: string }
      - { label: Intro, name: intro, widget: text, required: false, hint: 'One or two sentences under the title, in italics' }
      - { label: Body, name: body, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list], editor_components: [] }
      - label: Links
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: Link text, name: label, widget: string }
          - { label: URL, name: url, widget: string, hint: 'https://…, mailto:…, or a page on this site like /' }

  - name: projects
    label: Projects
    label_singular: Project
    description: >-
      The case studies on the book shelf. Clicking the books on the desk shows every project as a
      book; clicking a book opens its own page. Shown in order of their number.
    folder: content/projects
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: title
    slug: '{{fields.slug}}'
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    media_folder: /public/uploads/books
    public_folder: /uploads/books
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Page address, name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, numbers and dashes, e.g. flying-high'], hint: 'The project page lives at /books/ followed by this, e.g. /books/flying-high. Changing it breaks old links.' }
      - { label: Order on the shelf, name: order, widget: number, value_type: int, min: 1 }
      - { label: Subtitle, name: subtitle, widget: string, required: false, hint: 'One line under the title' }
      - { label: Cover, name: cover, widget: image, hint: 'Front cover, portrait (about 2:3)' }
      - { label: Spine, name: spine, widget: image, required: false, hint: 'Tall, narrow strip shown on the side of the book (about 1:8)' }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Client, name: client, widget: string, required: false }
      - { label: Role, name: role, widget: string, required: false }
      - { label: Intro, name: intro, widget: text, required: false, hint: 'A sentence or two, set large under the title' }
      - { label: Case study, name: body, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list], editor_components: [] }
      - label: Images
        name: gallery
        widget: list
        required: false
        summary: '{{fields.caption}}'
        hint: 'The first image is shown full width, the rest two to a row'
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: Link
        name: link
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Link text, name: label, widget: string, required: false }
          - { label: URL, name: url, widget: string, required: false, hint: 'e.g. the live product or an article about it' }

  - name: rail
    label: Clothes rail
    description: The clothes hanging on the rail on the laptop's page. Each piece turns to face the visitor on hover and opens up close on click.
    media_folder: /public/uploads/rail
    public_folder: /uploads/rail
    editor:
      preview: false
    files:
      - name: rail
        label: Clothes rail
        file: content/rail.json
        format: json
        fields:
          - { label: Title, name: title, widget: string, required: false, hint: 'Small line above the rail. Leave empty to hide it' }
          - label: Pieces
            name: items
            widget: list
            summary: '{{fields.name}}'
            hint: 'Shown on the rail in this order'
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Note, name: note, widget: string, required: false, hint: 'One short line, e.g. colour and print' }
              - { label: Photo, name: image, widget: image, hint: 'Front-facing product photo with a transparent background (PNG or WebP); square or landscape. Used if 3D is unavailable, and by default its middle is printed on the 3D shirt and its colour used for the rest' }
              - { label: Design for the 3D shirt, name: design, widget: image, required: false, hint: 'Optional: just the artwork (PNG with a transparent background works best). It is printed on the chest of the 3D shirt instead of the photo' }
              - { label: Shirt colour, name: colour, widget: color, required: false, hint: 'Optional: the colour of the 3D shirt. Leave empty to take it from the photo' }
              - label: Print area from the photo
                name: front
                widget: object
                required: false
                collapsed: true
                hint: 'Optional, used when there is no design: which part of the photo is printed on the 3D shirt, as fractions of its width and height (0 to 1). Leave empty for the middle of the photo (0.24 to 0.76 across, 0 to 1 down)'
                fields:
                  - { label: Left, name: x0, widget: number, value_type: float, min: 0, max: 1, step: 0.01, required: false }
                  - { label: Right, name: x1, widget: number, value_type: float, min: 0, max: 1, step: 0.01, required: false }
                  - { label: Top, name: y0, widget: number, value_type: float, min: 0, max: 1, step: 0.01, required: false }
                  - { label: Bottom, name: y1, widget: number, value_type: float, min: 0, max: 1, step: 0.01, required: false }

  - name: site
    label: Site settings
    description: The site's name and the interface text around the desk.
    editor:
      preview: false
    files:
      - name: site
        label: Site name and labels
        file: content/site.json
        format: json
        fields:
          - { label: Site name, name: name, widget: string, hint: 'Shown in the browser tab' }
          - { label: Favicon, name: favicon, widget: image, required: false, hint: 'The little icon in the browser tab and on phone home screens. A square PNG with a transparent background, at least 192 × 192' }
          - { label: Header title, name: heading, widget: string, required: false, hint: 'Top-left of the page, linking home; the last word is set in italics. Leave empty to show the site name instead' }
          - { label: Hint (mouse), name: hint, widget: string, hint: 'Top-right on computers' }
          - { label: Hint (touch screens), name: hintTouch, widget: string, hint: 'Top-right on phones and tablets' }
          - { label: Hint (no 3D), name: hintNo3d, widget: string, hint: 'Shown instead if the browser cannot show the 3D desk' }
          - { label: Back button, name: back, widget: string, hint: 'At the top of each page' }
          - { label: Next link label, name: next, widget: string, hint: 'Above the next object at the end of each page' }
          - { label: Lamp name, name: lampName, widget: string, hint: 'Shown when hovering the lamp' }
          - { label: Lamp hint, name: lampHint, widget: string, required: false }
          - { label: Speakers name, name: speakersName, widget: string, hint: 'Shown when hovering the speakers either side of the laptop' }
          - { label: Speakers hint, name: speakersHint, widget: string, required: false, hint: 'Clicking the speakers plays or pauses the music' }
          - { label: Laptop screen, name: laptopScreen, widget: image, required: false, hint: 'Picture shown on the laptop. Landscape, about 3:2 (e.g. 1500 × 1000); it is cropped to fill the screen. Leave empty to show the code editor.' }
          - { label: Music, name: music, widget: file, required: false, hint: 'Background music: an MP3 (a few MB at most), played quietly on a loop. It starts with the first click on the page, and the music button in the header pauses it. Leave empty to hide the button.' }
          - { label: Hover sound, name: hoverSound, widget: file, required: false, hint: 'A short sound (WAV or MP3, under a second is best) played when an object on the desk is hovered. Browsers only allow it after the first click on the page, and muting the music silences it too. Leave empty for no sound.' }
          - { label: Credits button, name: credits, widget: string, hint: 'Opens the 3D model credits (the licences require them to stay on the page)' }
